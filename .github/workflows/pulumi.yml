name: Pulumi

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  PULUMI_STACK: ${{ vars.PULUMI_STACK || 'main' }}
  TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

jobs:
  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Previews are keyed per PR so they never queue behind an apply or another
    # PR. The default single-slot queue coalesces to the newest commit: a
    # superseded preview is dropped while still pending rather than cancelled
    # mid-run, which keeps us clear of the stack lock either way.
    concurrency:
      group: pulumi-preview-${{ vars.PULUMI_STACK || 'main' }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: true
      - run: go test ./...
      - uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: ${{ env.PULUMI_STACK }}
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  up:
    name: Apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialise applies: two merges close together otherwise race for the stack
    # lock and the loser dies on a 409. queue: max is required because the
    # default holds only one pending run and cancels it when the next arrives,
    # which would silently drop a merge's infra change.
    concurrency:
      group: pulumi-up-${{ vars.PULUMI_STACK || 'main' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: true
      - run: go test ./...
      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - name: Retire decommissioned devices
        run: bash scripts/remove-retired-devices.sh
